name = "sms"
main = "workers.js"
compatibility_date = "2026-09-01"

# Keep this off: the WAF rules only apply to the custom domain below, so leaving
# the *.workers.dev route enabled would let anyone bypass them.
workers_dev = false

# Replace with your own domain. custom_domain = true makes `wrangler deploy`
# create the DNS record automatically.
[[routes]]
pattern = "your-subdomain.example.com"
custom_domain = true

# Create the database once, then paste the id it prints:
#   npx wrangler d1 create sms-forwarder
# The binding name must be `DB`; the Worker looks it up by that name.
[[d1_databases]]
binding = "DB"
database_name = "sms"
database_id = "c8b7129b-356a-45ef-b4cb-01f48cb9ddbc"

[vars]
# Warning: never put your password here. Store it as a secret instead:
#   npx wrangler secret put ADMIN
MAX_RECORDS = "200"
